# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual: MkDocs Material from docs/, with the API reference
# rendered from the XML documentation comments (scripts/api-docs.sh).
# Built in strict mode on every pull request and push, so a broken
# intra-manual link or a missing page fails; deployed to GitHub Pages
# from main by the official Pages actions. Reproduce with `make docs`.
#
# Deployment needs the repository's Pages source set to "GitHub
# Actions" (build_type workflow); DEVELOPMENT.md lists it.
name: Docs

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build the manual (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install MkDocs (hash-checked)
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/pip" install --require-hashes --no-deps -r docs/requirements.txt

      - name: API reference from the XML documentation comments
        run: scripts/api-docs.sh

      - name: mkdocs build --strict
        run: '"$RUNNER_TEMP/docs/bin/mkdocs" build --strict'

      - name: The author link is on every page
        run: |
          set -euo pipefail
          missing="$(grep -L 'href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>' $(find site -name '*.html'))"
          if [ -n "$missing" ]; then
            echo "::error::pages without the author link:"
            echo "$missing"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
